# 保管庫(Supabase)の無料プランは、1週間まったく使われないと自動でお休みに入ってしまう。
# それを防ぐため、3日に1回だけ自動で保管庫に軽く声をかけ、「使われている」状態を保つ。
# あわせて、保管庫に異常があればこの処理が失敗してGitHubからメールが届くので、
# 不具合の早期発見にも役立つ。
name: 保管庫を眠らせない

on:
  schedule:
    # 3日ごと、日本時間のお昼12時ごろ(UTCの午前3時)に実行
    - cron: '0 3 */3 * *'
  # 手動でも実行できるようにしておく
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 保管庫に声をかける
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o response.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/courses?select=id&limit=1")
          echo "応答コード: ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::保管庫からの応答が異常です(応答コード ${code})。Supabaseの状態をご確認ください。"
            cat response.txt || true
            exit 1
          fi
          echo "保管庫は正常に応答しました。"
          rm -f response.txt

      - name: 実行日時を記録する(GitHubの自動実行が止まるのを防ぐため)
        run: |
          date -u '+最終確認: %Y-%m-%d %H:%M UTC' > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --staged --quiet; then
            echo "記録に変更はありませんでした。"
          else
            git commit -m "保管庫の定期確認 [skip ci]"
            git push
          fi
