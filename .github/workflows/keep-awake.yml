# 保管庫(Supabase)の無料プランは、しばらく使われないと自動でお休みに入ってしまう。
# 公式の目安は「1日に数回のデータベースへのアクセスが、直近1週間あること」。
# それを満たすため、4時間ごと(1日6回)に、サイト本体と同じ部品(supabase-js)で
# サイトを開いたときと同じ読み込みを行う(中身は scripts/keep-awake.mjs)。
# 保管庫に異常があればこの処理が失敗してGitHubからメールが届くので、見張り番も兼ねる。
#
# 経緯(2026-09): 当初は「3日に1回・1か所だけ」の呼びかけで、応答は正常だったにもかかわらず
# Supabaseに活動と数えてもらえず停止された。そのため頻度と読み込み方を見直した。
name: 保管庫を眠らせない

on:
  schedule:
    # 4時間ごと(毎時0分ちょうどは混雑して遅れやすいため23分にずらす)
    - cron: '23 */4 * * *'
    # 毎週月曜: あわせて実行記録を更新する(GitHubの自動実行は60日動きがないと止まるため)
    - cron: '47 1 * * 1'
  # 手動でも実行できるようにしておく
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 保管庫に声をかける
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/keep-awake.mjs

      - name: 実行記録を更新する(週1回)
        if: github.event.schedule == '47 1 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          date -u '+最終確認: %Y-%m-%d %H:%M UTC' > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --staged --quiet; then
            echo "記録に変更はありませんでした。"
          else
            git commit -m "保管庫の定期確認 [skip ci]"
            git push
          fi
